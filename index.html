<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Teste</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #eee; }
        main { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .log { margin-bottom: 10px; }
        input { display: block; width: 100%; padding: 10px; margin-top: 5px; }
        input[type="submit"] { background: blue; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <main>
        <h1>Login</h1>
        <!-- O id deve ser único -->
        <form id="meuFormulario">
            <section class="log">
                <input type="email" id="campo_email" placeholder="E-mail" required>
            </section>
            <section class="log">
                <input type="password" id="campo_senha" placeholder="Senha" required>
            </section>
            <section>
                <!-- O tipo deve ser SUBMIT para o formulário entender o envio -->
                <input type="submit" value="Entrar">
            </section>
        </form>
    </main>

    <script>
        const form = document.getElementById('meuFormulario');

        form.addEventListener('submit', function(event) {
            // 1. ISSO impede a página de recarregar/limpar
            event.preventDefault(); 
            
            // 2. Pegamos os valores pelos IDs corretos
            const email = document.getElementById('campo_email').value;
            const senha = document.getElementById('campo_senha').value;
            
            console.log("Tentando logar com:", email);

            // 3. Teste simples de validação
            if (email === "teste@teste.com" && senha === "123") {
                alert("Login de teste aceito!");
                window.location.href = "on-off.html"; // Redireciona
            } else {
                alert("Para este teste use: teste@teste.com e senha 123");
            }
        });
    </script>
</body>
</html>
